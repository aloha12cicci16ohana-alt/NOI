<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NOI Hologram Image Motion Preview</title>
    <link rel="stylesheet" href="css/hologram-image-motion.css" />
    <script src="js/hologram-image-motion.js" defer></script>
  </head>
  <body class="hologram-image-motion-preview">
    <div class="hologram-image-motion" aria-hidden="true">
      <div class="hologram-image-motion__still"></div>
      <div class="hologram-image-motion__still hologram-image-motion__still--ghost"></div>
      <canvas class="hologram-image-motion__canvas"></canvas>
      <span class="hologram-image-motion__light hologram-image-motion__light--one"></span>
      <span class="hologram-image-motion__light hologram-image-motion__light--two"></span>
      <span class="hologram-image-motion__grain"></span>
    </div>
  </body>
</html>
